[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelproof"
version = "0.1.0"
description = "Validated JSON model serving with reproducible digit-classifier evaluation."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1"]

[project.optional-dependencies]
train = ["scikit-learn>=1.8,<2", "numpy>=2,<3"]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "httpx2>=2,<3", "ruff>=0.17,<1", "build>=1.6,<2"]

[project.scripts]
pixelproof = "pixelproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixelproof = ["assets/*.json", "assets/*.sha256", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
